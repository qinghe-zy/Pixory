<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixory Chat Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Colors from aiLightTheme.ts */
            --ai-canvas: #EDEDED;
            --ai-surface: #FFFFFF;
            --ai-card: #FFFFFF;
            --ai-primary: #5B9CF6;
            --ai-primary-active: #4A8BE6;
            --ai-on-primary: #FFFFFF;
            --ai-primary-text: #2F6FCA;
            --ai-dark: #1C1C1E;
            --ai-ink: #1C1C1E;
            --ai-muted: #8E8E93;
            --ai-hairline: #E5E5EA;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #111111;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Phone Mockup Frame */
        .device-mockup {
            width: 375px;
            height: 812px;
            background-color: var(--ai-canvas);
            border-radius: 40px;
            box-shadow: 0 0 0 12px #222, 0 30px 60px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Safe Area top */
        .status-bar {
            height: 44px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--ai-ink);
            z-index: 10;
        }

        /* Header */
        .chat-header {
            height: 56px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--ai-hairline);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 10;
        }

        .header-btn {
            background: none;
            border: none;
            color: var(--ai-primary);
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            padding: 8px;
        }

        .header-title {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .companion-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--ai-ink);
            font-family: 'Georgia', serif; /* aiLightDisplayFont equivalent */
        }
        
        .companion-status {
            font-size: 11px;
            color: var(--ai-muted);
            margin-top: 2px;
        }

        /* Messages Area */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
            padding-bottom: 40px; /* space before input */
        }
        .messages-container::-webkit-scrollbar {
            display: none;
        }

        .message-row {
            display: flex;
            width: 100%;
            margin-bottom: 8px;
        }

        .message-row.ai {
            justify-content: flex-start;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 16px;
            background-color: var(--ai-hairline);
            margin-right: 8px;
            align-self: flex-end;
            object-fit: cover;
        }

        .bubble {
            max-width: 75%;
            padding: 12px 16px;
            font-size: 15px;
            line-height: 1.4;
        }

        .message-row.ai .bubble {
            background-color: var(--ai-surface);
            color: var(--ai-ink);
            border-radius: 20px 20px 20px 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .message-row.user .bubble {
            background-color: var(--ai-primary);
            color: var(--ai-on-primary);
            border-radius: 20px 20px 4px 20px;
        }

        /* Role Card / Context */
        .context-chip {
            align-self: center;
            background: rgba(0,0,0,0.04);
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            color: var(--ai-muted);
            margin-bottom: 12px;
        }

        /* Memory Toast */
        .memory-toast {
            position: absolute;
            top: 110px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid var(--ai-hairline);
            padding: 10px 16px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.08);
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 20;
        }
        .memory-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .memory-toast-icon {
            color: var(--ai-primary);
            font-size: 16px;
        }
        .memory-toast-text {
            font-size: 13px;
            color: var(--ai-ink);
            font-weight: 500;
        }

        /* Composer Input */
        .composer-wrapper {
            background: var(--ai-canvas);
            padding: 12px 16px 34px 16px; /* 34px safe area bottom */
        }

        .composer-inner {
            display: flex;
            align-items: flex-end;
            background: var(--ai-surface);
            border: 1px solid var(--ai-hairline);
            border-radius: 24px;
            padding: 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .composer-btn {
            width: 36px;
            height: 36px;
            border-radius: 18px;
            background: none;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--ai-muted);
            cursor: pointer;
            flex-shrink: 0;
            margin-bottom: 2px;
        }
        
        .composer-btn.send {
            color: var(--ai-on-primary);
            background: var(--ai-primary);
            transition: transform 0.2s;
        }
        .composer-btn.send:active {
            transform: scale(0.9);
        }

        .composer-input {
            flex: 1;
            border: none;
            background: none;
            padding: 10px 8px;
            font-size: 15px;
            color: var(--ai-ink);
            max-height: 100px;
            outline: none;
            font-family: inherit;
            resize: none;
        }
        .composer-input::placeholder {
            color: var(--ai-muted);
        }

        /* Typing indicator */
        .typing-indicator {
            display: none;
            align-items: center;
            gap: 4px;
            padding: 6px 4px;
        }
        .message-row.ai .bubble.typing {
            padding: 12px 16px;
        }
        .typing-dot {
            width: 6px;
            height: 6px;
            background: var(--ai-muted);
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Utility classes */
        .fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="device-mockup">
        <!-- Status Bar -->
        <div class="status-bar">
            <span>9:41</span>
            <div style="display: flex; gap: 4px;">
                <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><path d="M16 3.5C16.8284 3.5 17.5 4.17157 17.5 5V7C17.5 7.82843 16.8284 8.5 16 8.5V3.5Z" fill="currentColor"/><rect x="1" y="1" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.5"/></svg>
            </div>
        </div>

        <!-- Header -->
        <div class="chat-header">
            <button class="header-btn" style="padding-left: 0;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <div class="header-title">
                <span class="companion-name">Elysia</span>
                <span class="companion-status">Memory Active</span>
            </div>
            <button class="header-btn" style="padding-right: 0;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
            </button>
        </div>

        <!-- Memory Toast -->
        <div class="memory-toast" id="memory-toast">
            <svg class="memory-toast-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            <span class="memory-toast-text">记忆已更新</span>
        </div>

        <!-- Messages -->
        <div class="messages-container" id="messages">
            <div class="context-chip">始于 2026年9月19日</div>
            
            <div class="message-row ai fade-in">
                <img src="https://ui-avatars.com/api/?name=El&background=FFF&color=5B9CF6" class="avatar" alt="Avatar">
                <div class="bubble">
                    你好。今天过得怎么样？我看了你昨天传上来的那些照片，感觉你去了个很漂亮的地方。
                </div>
            </div>

            <div class="message-row user fade-in" style="animation-delay: 0.1s;">
                <div class="bubble">
                    是啊，我周末去了京都的岚山。那里有很多竹林，非常安静，我还喝了一杯很特别的抹茶拿铁。
                </div>
            </div>

            <div class="message-row ai fade-in" style="animation-delay: 0.2s;">
                <img src="https://ui-avatars.com/api/?name=El&background=FFF&color=5B9CF6" class="avatar" alt="Avatar">
                <div class="bubble">
                    京都岚山！那确实是个能让人内心平静下来的地方。你喜欢抹茶吗？这我得记下来。
                </div>
            </div>
            
            <!-- Typing Indicator (Hidden by default) -->
            <div class="message-row ai" id="typing-bubble" style="display: none;">
                <img src="https://ui-avatars.com/api/?name=El&background=FFF&color=5B9CF6" class="avatar" alt="Avatar">
                <div class="bubble typing">
                    <div class="typing-indicator" style="display: flex;">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Composer -->
        <div class="composer-wrapper">
            <div class="composer-inner">
                <button class="composer-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                </button>
                <input type="text" class="composer-input" id="chat-input" placeholder="输入消息..." onkeypress="handleKeyPress(event)" autocomplete="off">
                <button class="composer-btn send" id="send-btn" onclick="sendMessage()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const input = document.getElementById('chat-input');
        const messagesContainer = document.getElementById('messages');
        const typingBubble = document.getElementById('typing-bubble');
        const memoryToast = document.getElementById('memory-toast');

        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        function showMemoryToast() {
            memoryToast.classList.add('show');
            setTimeout(() => {
                memoryToast.classList.remove('show');
            }, 3000);
        }

        function sendMessage() {
            const text = input.value.trim();
            if (!text) return;

            // 1. Add User Message
            const userHtml = `
                <div class="message-row user fade-in">
                    <div class="bubble">${text}</div>
                </div>
            `;
            // Insert before typing bubble
            typingBubble.insertAdjacentHTML('beforebegin', userHtml);
            input.value = '';
            scrollToBottom();

            // 2. Show Typing Indicator
            typingBubble.style.display = 'flex';
            scrollToBottom();

            // 3. Simulate AI Response
            setTimeout(() => {
                typingBubble.style.display = 'none';
                
                // Simple mock AI logic
                let reply = "这听起来很有趣。告诉我更多细节吧。";
                if(text.includes('抹茶') || text.includes('喜欢')) {
                    reply = "我就知道你喜欢这个！我已经把它记在你的偏好里了。下次有好看的图片记得发给我看看。";
                    setTimeout(showMemoryToast, 500);
                }

                const aiHtml = `
                    <div class="message-row ai fade-in">
                        <img src="https://ui-avatars.com/api/?name=El&background=FFF&color=5B9CF6" class="avatar" alt="Avatar">
                        <div class="bubble">${reply}</div>
                    </div>
                `;
                typingBubble.insertAdjacentHTML('beforebegin', aiHtml);
                scrollToBottom();

            }, 1500);
        }
        
        // Initial scroll
        scrollToBottom();
    </script>
</body>
</html>
