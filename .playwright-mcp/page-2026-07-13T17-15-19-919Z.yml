            - generic [ref=f3e112]: 关注
          - heading "3月26日，微信派发文《微信聊天到底为什么会出现“对方正在输入”？》。文章科普“对方正在输入”背后的机制和设计理念。 首先，必须满足两个条件触发“对方正在输入”。 时效性：你发出消息后，对方必须在 10 秒内打开对话框。 动作感：对方打开了且还在输入框里打了字（哪怕只是打个空格）。 三种显示状态的含义—— 持续显示型：对方一直在打字 图片 时有时无型：对方在“打了删、删了打”间反复横跳 不显示型：可能是对方很忙，或者是你懂的情况 图片 “对方正在输入”背后原理，用专业术语来说，叫“信令握手”。微信聊天并非时刻连接，而是套高效的“对讲机指挥塔”模式。简单来说：用对讲机喊话得先申请临时私密频道。当你发起聊天，对讲机会向指挥塔申请对接；如果对方在10 秒内“拿起对讲机”，指挥塔便会捕捉并立刻通知你：“报告！对方已准备回话！”微信出现“对方正在输入”，是微信在帮你模拟面对面聊天的“实时同在感”。 微信没有“已读”功能，是因为——“已读”意味着“看见了，但没回你”。这会带来猜忌焦虑，甚至催促对方立刻回复。没有已读功能，是把“回应与否”的选择权交回用户手中。“对方正在输入”则是一种“有限度的透明”，告诉你“我在线，我在乎，我正在回应”。保留了对话的气口，也留给彼此思考和沉默的权利。 来源：江南都市综合微信派 值班编辑：喻妍 校对：张竹影 值班主任：周艳华 值班编委：郭宁" [level=1] [ref=f3e125]:
