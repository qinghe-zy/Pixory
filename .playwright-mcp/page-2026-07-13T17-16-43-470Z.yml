      - link "WeChat 仅支持撤回两分钟内传送的信息。长按（手指按住荧幕不松开）已传送的最后一条讯息 >「撤回」，即可将该讯息撤回。 说明：1. WeChat 支援撤回语音、文字、图片、影片、名片、位置讯息等。2. 如果讯息已传送超过两分钟，长按讯息则不会显示「撤回」。" [ref=f11e75] [cursor=pointer]:
